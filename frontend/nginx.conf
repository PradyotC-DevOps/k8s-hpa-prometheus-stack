# frontend/nginx.conf
server {
    listen 80;
    root /usr/share/nginx/html;

    # Proxy API requests to the Flask backend
    location /api/ {
        proxy_pass http://flask-backend:5000/api/;
    }

    # Handle React/Vite SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}