apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-backend
  template:
    metadata:
      labels:
        app: flask-backend
    spec:
      containers:
        - name: backend
          image: pradyotc/k8s-obs-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: web
---
apiVersion: v1
kind: Service
metadata:
  name: flask-backend
  labels:
    app: flask-backend
spec:
  selector:
    app: flask-backend
  ports:
    - port: 5000
      targetPort: 5000
      name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
        - name: frontend
          image: pradyotc/k8s-obs-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend
spec:
  type: NodePort # Allows us to port-forward easily
  selector:
    app: react-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
