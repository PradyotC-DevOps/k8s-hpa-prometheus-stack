apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-monitor
  labels:
    release: prometheus # Tells the Helm stack to pick this up
spec:
  selector:
    matchLabels:
      app: flask-backend
  endpoints:
    - port: web
      path: /metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Pods
      pods:
        metric:
          name: flask_http_request_per_second
        target:
          type: AverageValue
          averageValue: 15 # If a pod averages > 15 req/sec, scale up!
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
